# IClearMacro — interface for macros used with ClearMacroForwarderV1
# Extends IMacro with three EIP-712 type-derivation functions that provide
# the macro-specific type name, type definition string, and action struct hash
# needed for the EIP-712 digest that the signer approves.
#
# ⚠️ TESTNET ONLY — for use with ClearMacroForwarderV1 on OP Sepolia per PR #2148.
#
# Implement this interface (or extend ClearMacroBase) to create a macro
# compatible with the Clear Macro relaying system.
#
# Calling convention for bytes arguments:
#   encodedPayload — abi.encode(IClearMacroForwarderV1.Payload); same bytes passed to runMacro
#   actionParams   — Payload.action.params only; passed to getActionStructHash, buildBatchOperations, postCheck

meta:
  name: IClearMacro
  version: v1
  notes:
    - "TESTNET ONLY: for use with ClearMacroForwarderV1 on OP Sepolia per PR #2148."
    - "Implementations may extend ClearMacroBase, which decodes encodedPayload and actionParams according to the calling convention above."
    - "The Action EIP-712 type name must be exactly 'Action' — the forwarder uses it verbatim when assembling the full type definition string."
    - "Action type definition must be flat (no nested struct types) per the IClearMacro contract requirement."
    - "DashboardClearMacro @ 0x77232a2a953b570d1fee1fe16b1902299fe7b898 (OP Sepolia) is a reference implementation demonstrating all seven operation types."
  source:
    - https://raw.githubusercontent.com/superfluid-org/protocol-monorepo/1b1e2b09ffcf553fff49ec9b243277c370144eb0/packages/ethereum-contracts/contracts/interfaces/utils/IClearMacro.sol
    - https://raw.githubusercontent.com/superfluid-org/protocol-monorepo/1b1e2b09ffcf553fff49ec9b243277c370144eb0/packages/ethereum-contracts/contracts/interfaces/utils/IMacro.sol
  implements: [IMacro]
  abstract: true   # interface — not deployed standalone; each macro deploys its own implementation

# == EIP-712 Type Derivation ==
# These three functions are called by ClearMacroForwarderV1 to construct the
# EIP-712 type definition and struct hash for the payload the signer approves.
# The forwarder assembles the full type string as:
#   "<PrimaryTypeName>(Action action,Security security)<ActionTypeDef><SecurityTypeDef>"

getPrimaryTypeName:
  # Returns the EIP-712 primary type name rendered prominently by wallets.
  # Should concisely describe the action or intent being signed.
  # Examples: "SetDCAPosition", "CreateFlow", "UpdateStream"
  notes:
    - "The returned name becomes the top-level type in the EIP-712 types object. Wallets typically display this name to the user as the action header."
    - "Gotcha: the forwarder passes the full encodedPayload here, not just actionParams. Implementations that dispatch to multiple action types can decode the discriminant from the payload."
  mutability: view
  inputs:
    - encodedPayload: bytes   # abi.encode(IClearMacroForwarderV1.Payload)
  outputs:
    - name: string

getActionTypeDefinition:
  # Returns the EIP-712 type definition string for the Action struct.
  # The type name MUST be 'Action'; only the field list differs per macro.
  # The type MUST be flat (no nested struct types).
  # Example: "Action(address token,address receiver,int96 flowRate)"
  notes:
    - "Gotcha: the type name in the returned string must be exactly 'Action'. The forwarder concatenates this directly into the full type definition. A misnamed type produces an invalid digest."
    - "Gotcha: nested struct types are not supported. All Action fields must be primitive ABI types (address, uint256, int96, bytes32, string, bytes, etc.)."
  mutability: view
  inputs:
    - encodedPayload: bytes   # abi.encode(IClearMacroForwarderV1.Payload)
  outputs:
    - typeDef: string

getActionStructHash:
  # Computes the EIP-712 struct hash of the action for the given actionParams.
  # Must be constructed per the EIP-712 standard using the Action type definition
  # from getActionTypeDefinition:
  #   keccak256(abi.encode(keccak256(bytes(actionTypeDef)), field1, field2, ...))
  notes:
    - "Gotcha: actionParams here is Payload.action.params only, NOT the full encodedPayload. Decode the action fields from this argument."
    - "Dynamic types (string, bytes) must be keccak256-hashed before encoding per EIP-712."
  mutability: view
  inputs:
    - actionParams: bytes     # Payload.action.params (macro-specific action encoding)
  outputs:
    - structHash: bytes32

# == Macro Execution (from IMacro) ==
# Inherited interface methods called by ClearMacroForwarderV1 after security checks pass.

buildBatchOperations:
  # Build the list of Host batch operations to execute on behalf of the signer.
  # Called by the forwarder after all security and signature checks pass, before
  # forwarding to Host.batchCall.
  notes:
    - "Gotcha: params is Payload.action.params (same bytes as actionParams in getActionStructHash), NOT the full encodedPayload."
    - "The account argument is the signer — the address on whose behalf operations run inside the Host."
  mutability: view
  inputs:
    - host: address           # ISuperfluid host contract
    - params: bytes           # Payload.action.params
    - account: address        # signer address
  outputs:
    - operations: tuple[]     # ISuperfluid.Operation[]

postCheck:
  # Called by the forwarder after Host.batchCall completes.
  # Inspect post-execution on-chain state and revert if the result is unexpected.
  # Implement as empty if no post-execution check is needed.
  notes:
    - "Gotcha: params is Payload.action.params, same as buildBatchOperations — not the full encodedPayload."
    - "A revert here causes the entire runMacro call to revert, unwinding the batch execution."
  mutability: view
  inputs:
    - host: address
    - params: bytes
    - account: address
